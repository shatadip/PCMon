name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write # attach PCMon.exe to releases on v* tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test PCMon.sln -c Release

      - name: Publish single-file exe
        run: >
          dotnet publish src/PCMon -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish

      - name: Self-test the published exe
        shell: pwsh
        run: |
          $p = Start-Process publish/PCMon.exe -ArgumentList '--selftest', 'selftest.json' -Wait -PassThru
          Get-Content selftest.json
          if ($p.ExitCode -ne 0) { throw "PCMon --selftest failed with exit code $($p.ExitCode)" }

      - uses: actions/upload-artifact@v4
        with:
          name: PCMon
          path: publish/PCMon.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/PCMon.exe
          generate_release_notes: true
